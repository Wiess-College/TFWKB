# The Wiess websites, archived. For a specific page version use the Wayback short form
# [@wb <timestamp> <url>]; these entries are for citing a site or a stable page as a whole.

- key: riceinfo-site
  title: "The first Wiess website: riceinfo.rice.edu/projects/colleges/wiess/ (David M. Cunningham 1997, Ray Wagner 1999)"
  type: website
  date: 1997–2002
  url: https://web.archive.org/web/20001119201200/http://riceinfo.rice.edu:80/projects/colleges/wiess/
  local: riceinfo.rice.edu-wiess/ (text in text/, reading guide DIGEST.md)
  evidence: P
  notes: >
    116 page versions captured Jan 1998 – Jun 2002; also served as www.rice.edu/projects/colleges/wiess/
    (Aug 2000 – Jun 2001). Sections: college (history, gloss, crest, architecture, rooms, theman, photos),
    traditions (index, beerbike, battlesows, teamwiess, ubangee, pumpkin, jamfest, collegenight, crack,
    hanszensucks, norse, tieday), people, rules, news/minutes. Three sections transcribe the 1994 Freshman Handbook.

