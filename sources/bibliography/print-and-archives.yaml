# The Rice Thresher, the Campanile, Rice History Corner, archives, artifacts.
# Thresher pages: cite [@portal <ark> p.N] (Portal to Texas History page permalink), or [@thresher-web ...]
# for ricethresher.org articles. Campanile pages: the college holds scans in artifacts/campanile-pages/.

- key: thresher-portal
  title: "The Rice Thresher, 1916–c.2009, digitised with OCR at the Portal to Texas History (UNT)"
  type: newspaper
  date: 1916–2009
  url: https://texashistory.unt.edu/explore/collections/TRT/
  evidence: P
  notes: >
    Ark IDs are sequential by issue (Vol.71 No.1 = metapth245533 … Vol.72 No.4 = metapth245566).
    Per-page OCR at /ark:/67531/<id>/m1/<page>/ocr/; per-issue hit snippets at /ark:/67531/<id>/hits/?format=json&q=<query>.
    Cite a page as [@portal metapth245573 p.27].

- key: thresher-web
  title: "The Rice Thresher online (ricethresher.org), c.2009–present"
  type: newspaper
  date: 2009–
  url: https://www.ricethresher.org/
  evidence: P
  notes: Site search renders nothing; /section/news?page=N paginates the archive; article slugs end in -YYYYMMDD. Cite the article URL in the locator.

