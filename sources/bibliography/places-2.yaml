- key: rice-facilities-first-100-years
  title: "Rice University Facilities Engineering & Planning, 'Construction at Rice: The First 100 Years'"
  type: website
  date: current
  url: https://facilities.rice.edu/construction/the-first-100-years
  evidence: R
  notes: >
    Building-by-building record. Old Wiess: "laid out as an E-shaped building, with three north-south wings,
    joined on the north ends by a long east-west spine, forming two open quadrangles"; "North Hall" until its
    dedication in March 1950. New Wiess (2002, Machado Silvetti): the original building "was completely demolished
    in 2002". South Servery complex (2002): the Wiess Commons, the Hanszen Commons, and "South servery surmounted
    by a large public terrace overlooking the nearby playing fields". South Plant 2009. Read 2026-10-05.
  gaps: Not yet captured in the Wayback Machine by us; capture before citing heavily. Says nothing of brickwork.

- key: rice-news-1999-10-14-groundbreaking
  title: "Philip Montgomery, 'Continuing the Wiess Tradition', Rice News, 14 October 1999"
  type: newspaper
  date: 1999-10-14
  url: https://news2.rice.edu/1999/10/14/continuing-the-wiess-tradition/
  evidence: P
  notes: >
    Report of the 5 Oct 1999 groundbreaking "at the site of the new Wiess Commons on what used to be an intramural
    playing field south of the existing Wiess College and west of Hanszen College". "The new building will
    incorporate the medallions, plaques and original cornerstone from old Wiess College." About 200 students in
    gold T-shirts chanting "Team Wiess". Read 2026-10-05.
  gaps: Which medallions and plaques, and where they are set in the new building, is not said.
