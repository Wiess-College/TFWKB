# Night of Decadence: the record of its troubles and the institution's responses, 1998–2025.
# One entry per article actually read. Portal pages: url is the page permalink; the same page can be
# cited inline as [@portal metapth<ID> p.N]. ricethresher.org: url is the article URL that resolved
# (the /article/YYYY/MM/slug form; the -YYYYMMDD slug form often refuses automated readers).
# Dates given as YYYY-MM are taken from the article URL where the date line could not be read.

- key: nod-talk-magister
  title: "'Research on NOD: Overview', talk by a Wiess Magister (slides)"
  type: artifact
  date: c.2024–2025
  local: artifacts/nod-talk-magister/
  held_by: "Wiess College artifacts collection"
  evidence: R
  notes: >
    Broadly shared within the college; author not named here by choice. Given after NOD 2023 to explain
    "what probation meant" and to "design an intervention to change NOD". Reads NOD's troubles as those of
    a fraternity party (objectification of women, "toxic male behaviors", binge drinking on hard alcohol),
    citing Thresher pieces from 1999, 2009, 2012, 2014, 2017, 2022 and 2023; lists university alcohol
    changes "1999: Privates. 2012: Hard alcohol. 2023: Hard alcohol again."; and closes "Traditions define
    identity. But identity also creates traditions."

# --- 1998 ---------------------------------------------------------------------------------------

- key: thresher-1998-10-30-nod-security
  title: "Susan Egeland, 'NOD continues high security', Rice Thresher, 30 Oct 1998, p.7"
  type: newspaper
  date: 1998-10-30
  url: https://texashistory.unt.edu/ark:/67531/metapth246631/m1/7/
  evidence: P
  notes: >
    NOD 1998, "in its 25th year", theme "Silver Anniversary—NOD's Greatest Hits"; $6 tickets, non-Rice
    guests only with a Rice ID holder; at least 50 student security and five Campus Police. Social
    coordinator: "last year's socials thought that the party wasn't safe enough so they decided to restrict
    who could get into the party by limiting it to Rice people and their guests."

- key: thresher-1998-10-30-editorial
  title: "Editorial, 'Go have fun at NOD, but remember the rules', Rice Thresher, 30 Oct 1998, p.2"
  type: newspaper
  date: 1998-10-30
  url: https://texashistory.unt.edu/ark:/67531/metapth246631/m1/2/
  evidence: P
  notes: >
    "remember that the person you grope at NOD may be sitting next to you in class on Monday … Things that
    are definitely not acceptable include unwanted sexual advances." The same issue (p.4) carries a letter
    listing past themes—"Lust in Space" (1994), "Dante's Inferno", "Co-eds in Chains"—and calling the
    party "the 25th celebration".

# --- 1999: the Magisters' letter and the replies --------------------------------------------------

- key: thresher-1999-02-05-masters-letter
  title: "Jen Frazer, 'Night of Decadence scrutinized, future uncertain: Group of masters asks Wiess to evaluate NOD', Rice Thresher, 5 Feb 1999, pp.1, 7"
  type: newspaper
  date: 1999-02-05
  url: https://texashistory.unt.edu/ark:/67531/metapth246638/m1/1/
  evidence: P
  notes: >
    "Ten of the 16 college masters" asked Wiess to reconsider NOD in a letter of 26 Jan 1999 by Will Rice
    Magisters Dale and Elise Sawyer, co-signed by the Magisters of Lovett, Hanszen, Baker and Jones; p.7 prints
    excerpts ("Each of our two years at WRC, we have heard reasonable female students complain to peers
    about being groped and grabbed, even after having said 'No,' at NOD"). The Wiess Magisters forwarded it to
    VP for Student Affairs Zenaido Camacho under the sexual-harassment reporting rule; the Sid Richardson and
    Brown Magisters had not signed ("I believe the members of Wiess College should decide the future of
    Wiess College activities"—John Bennett, Sid Magister).

- key: thresher-1999-02-05-wiess-cabinet
  title: "Brian Stoler, 'Wiess students discuss NOD, form task force' / 'Wiess students divided on NOD's merits', Rice Thresher, 5 Feb 1999, pp.1, 7"
  type: newspaper
  date: 1999-02-05
  url: https://texashistory.unt.edu/ark:/67531/metapth246638/m1/7/
  evidence: P
  notes: >
    About 80 Wiess members at Cabinet (3 Feb 1999). Some called the letter "an attack on their college's
    autonomy" ("This letter completely disregards the power of this cabinet"); others agreed with it ("Let's
    get drunk, let's get naked, let's hope we don't kill ourselves"). Cabinet took no action and formed a
    task force.

- key: thresher-1999-02-05-editorial
  title: "Editorial, 'Letter infringes on student freedoms', Rice Thresher, 5 Feb 1999, p.2"
  type: newspaper
  date: 1999-02-05
  url: https://texashistory.unt.edu/ark:/67531/metapth246638/m1/2/
  evidence: P
  notes: >
    The letter "is an attack on student self-governance within the college system, a system the masters have
    a duty to protect"; "10 of the 16 masters acted independently of the Committee of Masters".

- key: thresher-1999-02-12-reactions
  title: "Julie Hollar, 'Students, university react to NOD letter', Rice Thresher, 12 Feb 1999, p.1"
  type: newspaper
  date: 1999-02-12
  url: https://texashistory.unt.edu/ark:/67531/metapth246639/m1/1/
  evidence: P
  notes: >
    Camacho forms an ad hoc advisory committee to report by 5 March ("the letter was of great seriousness,
    and it needs a serious inquiry and response"); fliers at Wiess against Dale Sawyer; the college
    presidents mostly oppose the letter's approach. A Hanszen senior: "The things that happen at NOD are going
    to happen whether you abolish NOD or not."

- key: thresher-1999-02-12-letters
  title: "Letters, 'Community speaks out about Night of Decadence', Rice Thresher, 12 Feb 1999, p.4"
  type: newspaper
  date: 1999-02-12
  url: https://texashistory.unt.edu/ark:/67531/metapth246639/m1/4/
  evidence: P
  notes: >
    A page of letters on both sides: "Everyone on campus knows what NOD is, and if you go, you realize that
    you are putting yourself in a compromising position" (Christopher Huff, Hanszen); "I've known too many
    freshman women who were pressured into wearing things that felt extremely uncomfortable to them" (Stephen
    Huey, Brown); "NOD's fate, and the fate of all Rice activities, should be in the hands of the students"
    (Allyson McKenzie, Wiess); two Will Rice resident associates on the night's emergencies.

- key: thresher-1999-02-12-masters-replies
  title: "Statements by the college Magisters on the NOD letter, Rice Thresher, 12 Feb 1999, p.5"
  type: newspaper
  date: 1999-02-12
  url: https://texashistory.unt.edu/ark:/67531/metapth246639/m1/5/
  evidence: P
  notes: >
    Each signing couple of Magisters explains itself (Jones: "It was not our intention that it become a campus-wide
    issue"; Lovett: shift the party "away from its current emphasis on sex"); the Wiess Magisters, John and
    Paula Hutchinson, "reject outright the contention that NOD promotes a 'cultural tolerance for and real risk
    of sexual assault'" and note Wiess had already barred attendees with no Rice affiliation; the Sawyers:
    "not as a demand that NOD be halted, but as a request that it be further modified". Also a freshman's
    guest column, "Letter ignores student body".

- key: thresher-1999-02-12-bonig
  title: "Zach Bonig, 'NOD doesn't give us what we want', Rice Thresher, 12 Feb 1999, p.3"
  type: newspaper
  date: 1999-02-12
  url: https://texashistory.unt.edu/ark:/67531/metapth246639/m1/3/
  evidence: P
  notes: >
    A Lovett senior's column: "The masters are members of this community, and they have the right to question
    its practices as much as anyone"; "NOD needs to change or disappear."

- key: thresher-1999-02-19-robinson
  title: "Charlie Robinson (Wiess '75), letter 'NOD's critics need to act their age', Rice Thresher, 19 Feb 1999, p.4"
  type: newspaper
  date: 1999-02-19
  url: https://texashistory.unt.edu/ark:/67531/metapth246640/m1/4/
  evidence: P
  notes: >
    Signed "Organizer, Night of Decadence 1973, 1974"; a parent of two Rice students defending the party: "If
    anyone is offended, they do not have to attend". Answered 26 Feb 1999 (metapth246641 p.2, "Debate
    stifled on NOD").

- key: thresher-1999-03-19-ad-hoc-report
  title: "Jen Frazer and Brian Stoler, 'Colleges to take next step on NOD inquiry' / 'Report suggests survey to understand NOD's effects', Rice Thresher, 19 Mar 1999, pp.1, 5"
  type: newspaper
  date: 1999-03-19
  url: https://texashistory.unt.edu/ark:/67531/metapth246643/m1/1/
  evidence: P
  notes: >
    Camacho's ad hoc committee (three faculty, four college presidents, the UCourt chair, three staff, one
    Magister) reported on Tuesday 16 March: "serious problems associated with Night of Decadence, problems that
    are not peculiar to this event but that are most conspicuously associated with it"; it passed the issue to
    the Magisters and presidents and proposed a survey. A member: "we couldn't find hard data to support the
    statements in the letter".

- key: thresher-1999-04-23-presidents
  title: "J. Cameron Cooper, 'Presidents offer NOD changes' / 'Decency laws to be stressed at NOD', with 'The Presidents' NOD Recommendations', Rice Thresher, 23 Apr 1999, pp.1, 7"
  type: newspaper
  date: 1999-04-23
  url: https://texashistory.unt.edu/ark:/67531/metapth246649/m1/1/
  evidence: P
  notes: >
    The committee of the eight college presidents chaired by SA President Anne Countiss (ten meetings) sent
    its report to Camacho on 20 April: O-Week education and open forums at each college, a security
    coordinator and team at every college, lit paths, no non-Rice ticket sales at the door, "Eliminate
    decorations of a sexual nature from public display". The Associate General Counsel advised changing "the
    name and theme" to maximise the party's chance of continuing.

