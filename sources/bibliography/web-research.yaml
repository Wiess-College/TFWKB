  local: teamwiess.com/mirror/teamwiess.com/current-students.html/
  evidence: P
  notes: >
    Carries a third-party countdown widget labelled "Dis-O 2014", timed to 23 Aug 2014 00:00 UTC (evening of
    Friday 22 Aug, Houston), and a Downloads box with "Wiess Housing Rules (.pdf)". The only trace of Dis-O on a
    Wiess site in the corpus.

- key: thresher-2012-09-letters-rpc-dis-o
  title: "Risa Dieken (RPC Internal Vice President), letter to the editor, Rice Thresher, Sep 2012"
  type: newspaper
  date: 2012-09
  url: https://ricethresher.org/article/2012/09/letters-to-the-editor
  evidence: P
  notes: >
    Earliest Dis-O reference found: "the administration has always supported a Welcome Back Festival on the day of
    Dis-O to provide alternate activities to daytime drinking". Implies that Dis-O was a day students
    organised themselves, with the university running something else alongside it.

- key: thresher-2013-04-18-alcohol-policy
  title: "Joey Capparella and Molly Chiu, 'Changes to alcohol policy announced', Rice Thresher, 18 Apr 2013"
  type: newspaper
  date: 2013-04-18
  url: https://ricethresher.org/article/2013/04/changes-to-alcohol-policy-announced
  evidence: P
  notes: >
    Policy effective fall 2013: private-party hosts register with the college chief justice 24 hours ahead, stay
    present, and cap attendance at six times the room's residents; spirits over 50% ABV banned; hard alcohol banned
    on the days of "major events like Dis-Orientation and Beer Bike"; the existing ban on competitive drinking
    restated ("any form of competitive drinking does lead to excessive consumption of alcohol", Dean Hutchinson).

- key: thresher-2025-08-26-dis-o-transports
  title: "Juliana Lightsey, 'Dis-O, move-in weekend see increase in alcohol transports from last year', Rice Thresher, 26 Aug 2025"
  type: newspaper
  date: 2025-08-26
  url: https://www.ricethresher.org/article/2025/08/dis-o-move-in-weekend-see-increase-in-alcohol-transports-from-last-year
  evidence: P
  notes: >
    Dis-O 2025 transports "comparable to the seven NOD transports" of 2023 (Lovett president); many were freshmen
    (Sid Richardson president); Dean Gorman: "Excessive drinking is unhealthy and dangerous". Does not say who hosts
    Dis-O.

- key: thresher-2010-09-smoking-policy
  title: "'Smoking policy enacted', Rice Thresher, Sep 2010"
  type: newspaper
  date: 2010-09
  url: https://ricethresher.org/article/2010/09/smoking-policy-enacted
  evidence: P
  notes: >
    Policy No. 839, signed 3 Aug 2010 by President Leebron: no smoking "within 25 feet of all doorways and operable
    windows" or in "student housing and dining areas"; "Colleges may designate smoking areas that do not conflict
    with the areas prohibited". The basis for calling Toke an undesignated smoking spot.

- key: thresher-2012-08-30-smoking-policy
  title: "Michael He, 'New policy restricts smoking on campus', Rice Thresher, 30 Aug 2012"
  type: newspaper
  date: 2012-08-30
  url: https://ricethresher.org/article/2012/08/new-policy-restricts-smoking-on-campus
  evidence: P
  notes: >
    From 1 Sep 2012 smoking is confined to 13 designated areas with canopies and seating, driven by CPRIT grant
    conditions; a complete ban "was not practical or enforceable". So Rice was not fully tobacco-free in 2012; a
    later full ban is not established here.

- key: thresher-2022-04-jacks-past
  title: "'Looking at jacks from Beer Bikes past', Rice Thresher, Apr 2022"
  type: newspaper
  date: 2022-04
  url: https://ricethresher.org/article/2022/04/looking-at-jacks-from-beer-bikes-past
  evidence: P
  notes: >
    Jacks are "time-honored traditions especially popular during the week of Beer Bike". Examples by year,
    including 2006, when three named students "stuffed the Wiess College laundry room with newspapers" (who did it
