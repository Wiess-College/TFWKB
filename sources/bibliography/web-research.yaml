- key: thresher-2008-04-17-willy-revolutionaries
  title: "Sarah Rutledge, 'Willy revolutionaries return to Rice for 20th anniversary of prank', Rice Thresher, 17 Apr 2008"
  type: newspaper
  date: 2008-04-17
  url: https://ricethresher.org/article/2008/04/willy-revolutionaries-return-to-rice-for-20th-anniversary-of-prank
