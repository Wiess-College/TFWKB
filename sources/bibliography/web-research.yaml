    turned back "before the media gets wind of this".

- key: thresher-2008-03-20-unauthorized-jack
  title: "Jocelyn Wright, 'Unauthorized jack injures student', Rice Thresher, 20 Mar 2008"
  type: newspaper
  date: 2008-03-20
  url: https://ricethresher.org/article/2008/03/unauthorized-jack-injures-student
  evidence: P
  notes: >
    Shows jacks were approved through a college's jacks committee. Will Rice's committee "did not get the jack
    approved since they were not targeting a specific college". The dean's limits: "you can't violate the law, you
    can't violate the code of conduct and you can't endanger people's lives or well-being."

- key: rice-news-2011-11-04-traditions
  title: "'The story behind Rice traditions', Rice News, 4 Nov 2011"
