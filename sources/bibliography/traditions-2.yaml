- key: riceinfo-cabinet
  title: "Cabinet page, riceinfo site (rosters Feb 1999 – Feb 2001; Internal VP 'responsible for Summit, Pumpkin Caroling')"
  type: website
  date: 1999–2001
  url: https://web.archive.org/web/19990219085339/http://riceinfo.rice.edu:80/projects/colleges/wiess/people/cabinet.html
  local: riceinfo.rice.edu-wiess/text/people__cabinet.html__19990219085339.md (and four later captures)
