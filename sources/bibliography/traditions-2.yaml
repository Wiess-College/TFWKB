  type: newspaper
  date: 1983-09-30
  url: https://texashistory.unt.edu/ark:/67531/metapth245539/m1/15/
  evidence: P
  notes: >
    Earliest print trace of the name, the semester after Wiess went coed. Found in the
    Portal OCR; the page text is not held in the corpus and the Portal was unreachable from the build
