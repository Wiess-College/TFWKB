  type: blog
  date: 2015-01-23
  url: https://ricehistorycorner.com/2015/01/23/friday-follies-wiess-crack/
  local: ricehistorycorner.com/posts/2015-01-23_friday-follies-wiess-crack.md
  evidence: P
  notes: >
    Two scans of a Wiess Crack cover (image files named "wiess-crack-2-29-68"); Kean dates it to "the fall
    of 1968" and calls the 1960s "the Golden Age of college newsletters at Rice". The fifteen comments wander
