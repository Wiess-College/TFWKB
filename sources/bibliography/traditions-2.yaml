- key: teamwiess-jamfest-site
  title: "Jamfest sub-site, teamwiess.com/Jamfest/ (main, bands, playlist, news)—the 2005 edition as captured Feb 2007 and the 2007 edition as captured Jul 2007"
  type: website
  date: 2005–2007
  url: https://web.archive.org/web/20070206202205/http://www.teamwiess.com:80/Jamfest/main.htm
  local: teamwiess.com/mirror/teamwiess.com/Jamfest/
  evidence: P
  notes: >
    Feb 2007 captures still show Jamfest 2005 ("Friday April 15th, 2005", 4:00pm–2:00am, The Junior Varsity
    headlining, fourteen acts on two stages); Jul 2007 captures show Jamfest 2007 ("Friday April 14th, 2007"
    —a Saturday—2:00pm–2:00am, General Noise headlining, ten acts). The 2007 static site's jamfest.html
    links to it as "an older Jamfest site".

- key: teamwiess-lastnotes-2008
  title: "'Last Cabinet Notes'—O-Week Themed Cabinet, 28 Aug 2008, teamwiess.com (index.php?r=lastnotes)"
  type: website
  date: 2008-08-28
  url: https://web.archive.org/web/20080903215453/http://teamwiess.com/index.php?r=lastnotes
  local: teamwiess.com/mirror/teamwiess.com/index.php?r=lastnotes/teamwiess.com/20080903215453__index.php__r=lastnotes.html
  evidence: P
  notes: >
    Comic minutes of the first Cabinet of 2008–09. Summit venue debated ("the boat club like last year for
    $300 and a normal beach for $50"), Summit dated to the weekend of 20 Sep 2008; $832.69 approved for
    new powderpuff jerseys; the Socials' budget for the First Party of the Year.

- key: teamwiess-traditions-2014
  title: "teamwiess.com/traditions.html (Jun 2014 – Mar 2015): Ubangee, Wiess Day, Summit, then Jazz Night, NOD, Salsa Night, Big Bang, College Night"
  type: website
  date: 2014–2015
  url: https://web.archive.org/web/20150313224552/http://teamwiess.com/traditions.html
  local: teamwiess.com/mirror/teamwiess.com/traditions.html/
  evidence: P
  notes: >
    Ten captures, 27 Jun 2014 – 13 Mar 2015 (plus a /phone/ mirror). The June 2014 version has three
    traditions and a "Jazz Night" heading whose text is a pasted copy of the Wiess Day paragraph; by March
    2015 five more entries had been added, with Big Bang and College Night each appearing twice. The text
    is the 2014 O-Week book's, lightly edited. "In the spring of 2008, a new tradition began: Wiess Day!"
    No traditions page survives from the 2016–17 site.

- key: rhc-2015-01-23-wiess-crack
