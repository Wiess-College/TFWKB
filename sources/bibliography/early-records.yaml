- key: thresher-1967-10-05-hello-hamlet-review
  title: "Gil Dawson, 'Purloined comedy: Hello, Hamlet', Rice Thresher, 5 Oct 1967, p.7"
  type: newspaper
  date: 1967-10-05
  url: https://texashistory.unt.edu/ark:/67531/metapth245008/m1/7/
