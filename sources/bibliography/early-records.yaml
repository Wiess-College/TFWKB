- key: thresher-1961-04-07-water-wars
  title: "Griffin Smith, '[New] Dimension Added For Spring Sports At Colleges', Rice Thresher, 7 Apr 1961, p.3"
  type: newspaper
  date: 1961-04-07
  url: https://texashistory.unt.edu/ark:/67531/metapth231177/m1/3/
  evidence: P
  notes: >
    "Giant slingshots made of wire, cloth and surgical tubing" appeared on 20 March 1961; after Baker and Will
    Rice the battle "shifted to the Hanszen-Wiess courtyard", leaving "a carpet of broken balloons between
