- key: thresher-1966-10-20-tabletop
  title: "Rice Thresher, 20 Oct 1966, p.1—Roger Glade and Hanszen/Wiess membership"
  type: newspaper
  date: 1966-10-20
  url: https://texashistory.unt.edu/ark:/67531/metapth244981/m1/1/
  evidence: P
  notes: >
    Denied theatre funds by Hanszen, Glade "made his request to Wiess college, which eagerly accepted his
    plan. Glade produced 'Antigone' at Wiess last year, and is currently producing 'Doctor Faustus' for
