# Early records: the oldest contemporary written traces of Wiess traditions in the Rice Thresher, 1957–1990.
# Compiled 5–6 Oct 2026 for the "first attested" pass. One entry per page actually read.
# Method: texashistory.unt.edu search and hits pages were behind a human-verification (ALTCHA) check that
# was not completed. The same ark ids are served without the check by UNT's sister host
# digital.library.unt.edu (page OCR only, /ark:/67531/metapth<ID>/m1/<p>/ocr/), so every Thresher issue from
# Nov 1956 to Jan 1994 (ids 231040–231249 and 244885–245890, ~1,165 issues) was read page by page there and
# grepped for the item names. The url given is the canonical Portal page permalink; the text is identical on
# both hosts. Quotations are from OCR and silently correct only obvious OCR breaks.
# Evidence: P = written at the time; R = retrospective (written years later).

# --- 1950s–1960s --------------------------------------------------------------------------------

- key: thresher-1957-04-12-college-nights
  title: "Rice Thresher, 12 Apr 1957, p.1—first college nights"
  type: newspaper
  date: 1957-04-12
  url: https://texashistory.unt.edu/ark:/67531/metapth231056/m1/1/
  evidence: P
  notes: >
    The colleges' first spring. "Will Rice held its first College night last Tuesday, and Hanszen, Baker,
    and Wiess all plan College nights for the very near future." College Night here is the formal dinner
    with a guest, not the later Wiess entertainment of that name.

- key: thresher-1958-05-09-beer-drinking
  title: "Rice Thresher, 9 May 1958, p.5—Rondelet picnic (society column)"
  type: newspaper
  date: 1958-05-09
  url: https://texashistory.unt.edu/ark:/67531/metapth231090/m1/5/
  evidence: P
  notes: >
    The second Beer-Bike: rain, "the Beer-drinking contest which Wiess College won. (The bike race will be
    later)." No later 1958 issue reports the bike race. The 1985 winners' table credits Wiess with a
    1958 title [@thresher-1985-04-12-beer-bike-history].

- key: thresher-1961-03-17-college-night
  title: "'Vandiver Speaks Tuesday at Wiess', Rice Thresher, 17 Mar 1961, p.7"
  type: newspaper
  date: 1961-03-17
  url: https://texashistory.unt.edu/ark:/67531/metapth231174/m1/7/
