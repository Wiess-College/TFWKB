- key: thresher-1979-wiess-first-fifteen-years
  title: "'Wiess College: The First Fifteen Years', parts I–IV, Rice Thresher, 1, 8, 15 and 22 Feb 1979 (pp.6, 14, 14, 12)"
  type: newspaper
  date: 1979-02
  url: https://texashistory.unt.edu/ark:/67531/metapth245395/m1/14/
  evidence: R
  notes: >
    Serial history from the 1950s to c.1972 (part I metapth245394 p.6; part III metapth245396 p.14; part IV
    metapth245397 p.12). Part II: "At some time during these early years the playing field between Wiess
    and Hanszen came to be called (affectionately) 'the Acabowl'". Part III: president Tom Bertrand (1967–68)
    "was instrumental in establishing the Wiess Table Top Theater, which produced Hello, Hamlet! in its
    first year". Part IV: Greanias "produced in the Table Top Theater for the second time Hello, Hamlet!".

