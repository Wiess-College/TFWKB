- key: thresher-1968-04-01-tallyboo
  title: "Rice Thresher (April Fool issue), 1 Apr 1968, pp.2–3—'Rue Tallyboo'"
  type: newspaper
  date: 1968-04-01
  url: https://texashistory.unt.edu/ark:/67531/metapth245027/m1/3/
