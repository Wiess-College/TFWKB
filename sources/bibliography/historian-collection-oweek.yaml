# O-Week books from the maintainer's own collection (the tfwdb folder), October 2026.
# These four books have no public copy that we know of, so there is no url: a citation
# renders as plain text with the corpus path. Text layers are in
# historian-collection/text/<year>-oweek-book.txt (layout) and text-raw/ (reading order).
# Pages cite as [@key p.N], N = the PDF page (the printed folio is usually two lower).

- key: oweek-2019
  title: Wiess O-Week Book 2019
  type: oweek-book
  format: pdf
  date: 2019
  pages: 73
  local: historian-collection/oweek-books/2019-oweek-book.pdf
  evidence: P
  notes: >
    From the maintainer's own collection (tfwdb folder); no public copy known.
    Head Fellows Riley, Erica and Olasina; the last book in the corpus with the Schaefers as
    Magisters, "Willy Week", "the A-Team" and a NOD page (the cover still carries the template's
    "O-WEEK 2016"). Printed folios run two behind the PDF page.

