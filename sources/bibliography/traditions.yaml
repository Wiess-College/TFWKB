# Traditions: sources for the pages in docs/traditions/. Specific captures are cited inline with
# [@wb <timestamp> <url>]; these entries name a page, issue or article as a whole. Do not rename keys.

# --- Team Wiess, Ubangee, Night of Decadence, Beer Bike, Tabletop Theatre, pumpkin caroling

- key: rice-magazine-2016-wiess-traditions
  title: "Rice Magazine, Fall 2016—'Traditions: Wiess College—Where Pigs Fly'"
  type: magazine
  date: 2016-11
  url: https://magazine.rice.edu/2016/11/traditions-wiess-college/
  evidence: R
  notes: >
    The exact article behind the general entry rice-magazine-2016. Unbylined. On NOD: "George Pharr '75,
    who became master of Wiess in the early 1990s, attended the first NOD in 1972. There were only about
    30 male revelers in attendance"; themes "have morphed from 'classically apocalyptic' (Fall of Rome,
    Armageddon) to movie puns". On Hello Hamlet: "Written by George Greanias '70, it was first performed
    in 1967 with Greanias in the title role… now staged every four years by Wiess Tabletop Theater."
    On the War Pig: "In 1983… a small facsimile made of pig iron"; the wheeled pig and the rival chant
    "Wiess can't drive!". Live in October 2026; read with a fetch tool, not mirrored.

- key: lancaster-wiess-memorabilia
  title: "Kermit Lancaster, 'Wiess College memorabilia' (lancasterteam.com/wiess), 1970s shirts and NOD flyers"
  type: website
  date: 2007
  url: http://www.lancasterteam.com/wiess/index.html
  evidence: R
  notes: >
    An alumnus's photographs of his Night of Decadence shirts and flyers, "my shirts from the Beer-Bike
    Team, which was just then calling itself 'Team Wiess'", a grub jacket and Rally Club overalls.
    Rice History Corner (19 Feb 2013) described it as "some '70s era Wiess College memorabilia". Three
    sub-pages (NOD Flyers, NOD Shirts, Beer Bike Shirts) exist but were not readable from the build
    environment; they may carry NOD themes and dates from the 1970s. Site live in October 2026, © 2007.

- key: thresher-1966-11-03
  title: "Rice Thresher, 3 Nov 1966, p.5—pumpkin caroling 'had its revival last year at Baker College'"
  type: newspaper
  date: 1966-11-03
  url: https://scholarship.rice.edu/bitstream/handle/1911/66450/thr19661103.pdf
  evidence: P
  notes: >
    Quoted by commenter almadenmike on Rice History Corner, 31 Oct 2019: the Baker troupe "progressed to
    Will Rice, Hanszen (which threw water), and Wiess (which ignored them)… They have been going in cycles
    for years." Earliest print trace of pumpkin caroling at Rice in our corpus; Wiess is a bystander. The
    PDF itself has not been opened by us—read it and confirm the page.

- key: rice-archives-pumpkin-caroling-1969
  title: "Photograph: Wiess College students pumpkin caroling with candles, Halloween 1969 (Rice University archives, Woodson Research Center)"
  type: archive
  date: 1969-10-31
  url: https://scholarship.rice.edu/handle/1911/90905
  evidence: P
  notes: >
    Archives caption as quoted by almadenmike (Rice History Corner, 31 Oct 2019): "Students from Rice
    University's Wiess College standing outside a university building, holding candles and singing
    Christmas carols, during an event called 'pumpkin caroling'." Reproduced in the RHC posts of
    28 Oct 2016 and 30 Oct 2019. Earliest image of Wiess pumpkin caroling we know of. The repository page
    returned 403 to our fetch; confirm the handle and date from a browser.

- key: ricenod-site-2005
  title: "Night of Decadence site, www.RiceNOD.com / teamwiess.com/nod (launched 28 Sep 2005; 'NODDY BY NATURE')"
  type: website
  date: 2005-09-28
  url: https://web.archive.org/web/20061107094655/http://www.teamwiess.com:80/nod/
  local: teamwiess.com/mirror/teamwiess.com/nod/20061107094655__index.html
  evidence: P
  notes: >
    The 2005 party's own site, still served unchanged in Nov 2006 and Sep 2007. "Now in its 34th year";
    "originally began as a bring-your-own-mattress party called 'Rites of Spring'"; "By the mid-eighties…
    open to the Houston public. It was at that time that it made Playboy Magazine's list of top ten
    college parties"; Saturday 29 Oct 2005, 10PM–2AM; tickets $8 advance / $10 door; security force of
    85–115. The 2004 page (capture 20041204030907, "NOD Bless America: Choose your Position") is the
    year before.

