# Testimony: what people who were there told the Historian. Evidence class T.
# One entry per conversation or written statement; cite with a locator naming the topic.

- key: testimony-mullen-2026-10-05
  title: "Lach Mullen (Wiess RA, 2023–), notes to the Historian on current traditions, places and lore, 5 October 2026"
  type: other
  date: 2026-10-05
  evidence: T
  notes: >
    First-hand account by a resident associate of college life 2023–26: Big Bang (formerly a pre-NOD talk for
    first-years, now in flux — dance parties, scavenger hunts), DOME (early-fall party; black dress, seniors in red)
    and its spring counterpart Gatsby, Pumpkin Grades (after the first midterm break), Senior and Freshman Debates
    in the Commons, O-Week themes and shirt colours, the basement and Sparky's, the Commons, UpCo, the Acaterrace,
    Bacaterrace and Bacabowl, the owl in the brick of the south-servery utility stack, and the elevator custom.
    Some details withheld at the author's request.

- key: physicsforums-gazilcher-2010
