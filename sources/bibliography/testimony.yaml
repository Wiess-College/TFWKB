- key: testimony-mullen-2026-10-05b
  title: "Lach Mullen (Wiess RA, 2023–), further notes to the Historian on New Wiess's spaces, rooms and customs, 5 October 2026"
  type: other
  date: 2026-10-05
  evidence: T
  notes: >
    Second set of first-hand notes (16:15). Present-day names, which correct the places pages where they conflict:
    the Acaterrace is the small terrace between UpCo and the second-floor rooms, above the firepit; "Bacaterrace"
    for the south-servery roof is "just what Hanszen calls it"; Toke is the fourth-floor balcony, and can mean the
    fourth-floor walkway ("Toke is canon"). Rooms and spaces: 2FK and 3FK (floor kitchens), the Computer room, Small
    and Large classrooms, the OC lounge, Dance, Movie and Music rooms, Sparky's, UpCo, and the H&D office next to the
    Large classroom, formerly the RUPD office. The first-floor "120" stack was designed as a resident-faculty
    apartment, so every room above it differs from the rest of Wiess. The north-east-corner 5-man suites (two doubles
    and a single; corner windows, more space); the fourth-floor 5-man was by tradition the President's suite before
    2023; on the first floor the Large classroom takes its place. Wiess Grove, a garden of trees just south-west of
    the building. Lore: students said to have moved the stakes while Old Wiess was laid out, so that it was built
    "crooked" (never seen evidence). The TEAM / FAMILY / WIESS paper banners on the stairs from the Commons to UpCo,
    the "Family" banner said to carry a different F-word on its back and to be turned only for Beer Bike. TFFWs,
    Wiess's Friday events, in place of the KITQ/FITQ of other colleges.
