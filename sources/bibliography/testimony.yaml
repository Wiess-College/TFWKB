- key: testimony-mullen-2026-10-05b
  title: "Lach Mullen (Wiess RA, 2023–), further notes to the Historian on New Wiess's spaces, rooms and customs, 5 October 2026"
  type: other
  date: 2026-10-05
  evidence: T
  notes: >
    Second set of first-hand notes (16:15). Present-day names, which correct the places pages where they conflict:
    the Acaterrace is the small terrace between UpCo and the second-floor rooms, above the firepit; "Bacaterrace"
    for the south-servery roof is "just what Hanszen calls it"; Toke is the fourth-floor balcony, and can mean the
    fourth-floor walkway ("Toke is canon"). Rooms and spaces: 2FK and 3FK (floor kitchens), the Computer room, Small
    and Large classrooms, the OC lounge, Dance, Movie and Music rooms, Sparky's, UpCo, and the H&D office next to the
    Large classroom, formerly the RUPD office. The first-floor "120" stack was designed as a resident-faculty
    apartment, so every room above it differs from the rest of Wiess. The north-east-corner 5-man suites (two doubles
    and a single; corner windows, more space); the fourth-floor 5-man was by tradition the President's suite before
    2023; on the first floor the Large classroom takes its place. Wiess Grove, a garden of trees just south-west of
    the building. Lore: students said to have moved the stakes while Old Wiess was laid out, so that it was built
    "crooked" (never seen evidence). The TEAM / FAMILY / WIESS paper banners on the stairs from the Commons to UpCo,
    the "Family" banner said to carry a different F-word on its back and to be turned only for Beer Bike. TFFWs,
    Wiess's Friday events, in place of the KITQ/FITQ of other colleges.

- key: testimony-mullen-2026-10-05c
  title: "Lach Mullen (Wiess RA, 2023–), notes on customs, lore and retired traditions, 5 October 2026"
  type: other
  date: 2026-10-05
  evidence: T
  notes: >
    Third set of first-hand notes (17:21). The Acatramp, "a tradition that died out for safety reasons". Stairwells
    A (north-west corner), B (south-west) and D (north-east); freshmen are told that Stairwell C is hidden in the back
    of some rooms, closed off after a terrible accident (origin unknown). The vines on the façade, killed by the
    February 2021 freeze, overrun by rats in 2020 when the building was scarcely inhabited, resented for their shade
    by second- and third-floor residents and now missed; the bare metal grates and the "prison vibe". "Motel 6", the
    other colleges' name for Wiess, embraced because it beats "prison". The Breezeway and the Breezyway, two
    different spaces or names in New Wiess. Formal Dinner, when freshmen served upperclassmen; long tables; Wiess
    said to be the only college with square tables; "cornering" (sitting at a table corner). Servery customs:
    applause when a chair falls; music on Fridays from lunch to dinner. Study breaks held by many groups (a
    study-break glossary wanted). A Firepit rep who hosted firepit nights; reps come and go. The die game (a table,
    four cups of water on the corners, a die bounced off the table, many silly rules). Beer Bike hair: shaved heads,
    TFW or a single letter shaved in, goldenrod bleach, the "grandpa cut". Screen printing, once an O-Week activity
    and later a study break; old screens in the basement darkroom area; "YEAH WIESS", "YEAH BEER" and "YEAH WATER"
    for Beer Bike.
