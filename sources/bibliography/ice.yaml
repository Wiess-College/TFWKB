- key: wikipedia-broomball
  title: "'Broomball', Wikipedia (consulted 6 Oct 2026)"
  type: website
  date: 2026-10-06
  url: https://en.wikipedia.org/wiki/Broomball
  evidence: R
  notes: >
    Reference description of the game: played on ice in shoes rather than skates, two teams, a ball moved with a
    stick that has a broom-like head, goals at each end, scoring like hockey.

