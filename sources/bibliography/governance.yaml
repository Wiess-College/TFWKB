# Governance: constitutions, bylaws and rules, and the roster and minutes pages that record changes.
# The texts also live as tagged commits in the governance repo (Wiess-College/governance); cite the archived
# original here, or the tag as [@gov-repo v2013-02-08]. Single page captures are cited inline as [@wb <timestamp> <url>].

# --- Constitutions, bylaws and rules with a public copy

- key: gov-repo
  title: Wiess College governing documents as a git lineage (governance repo)
  type: governing-document
  date: 1991–2026
  url: https://github.com/Wiess-College/governance
  local: wiess-governance/
  evidence: P
  notes: >
    One tagged commit per ratified version—rules-1991, v1993-08-05, v2007-02-06, bylaws-2010,
    rules-2012, housing-2013, v2013-02-08, v2016-01-26, v2017-03-29, v2020-02-12, v2025-spring (undated; date estimated), v2026-02-23—text reflowed one
    paragraph per line so `git diff --word-diff` shows substance. CHANGES.md narrates the differences.
  gaps: Constitutions 1957–1993; anything between 1993 and 2007; the individual amendments of 2017–20; anything between February 2020 and early 2025 (including the fall-2021 hate-speech amendment text); bylaws 2016–2020.

