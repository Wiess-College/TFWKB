- key: rice-news-2021-02-15-winter-storm
  title: "Rice News, 'Winter storm prompts campus closures as temps approach record lows', 15 February 2021"
  type: website
  date: 2021-02-15
  url: https://news.rice.edu/news/2021/winter-storm-prompts-campus-closures-temps-approach-record-lows
  evidence: P
  notes: >
    "Rice, along with the rest of Houston, is approaching record-setting cold and a wintery mix of sleet and snow,
    with low temperatures dipping into the teens and a wind chill below zero degrees"; classes cancelled, Fondren,
    the RMC and the Rec Center closed, shuttles suspended, "dangerous road conditions and rolling blackouts". Read
    2026-10-05. Context for the February 2021 freeze only.
  gaps: Says nothing about damage to plants or buildings at Rice, or about Wiess.

