# --- Building history, the associates, and early web pages (1972 handbook, 2000 news, wiesscooks, Delany 2002)

- key: handbook-1972
  title: "Wiess College Freshman Handbook 1972—'The Architecture of Wiess' (as transcribed on the 1997–2000 riceinfo site)"
  type: oweek-book
  date: 1972
  url: https://web.archive.org/web/20001207040500/http://riceinfo.rice.edu:80/projects/colleges/wiess/college/architecture.html
  local: riceinfo.rice.edu-wiess/text/college__architecture.html__20001207040500.md
  evidence: P
  notes: >
    The riceinfo architecture page is headed "From 1972 Freshman Handbook"—Brutalism, "the best motel
    tradition", the "large grassy acabowls". Oldest handbook text in the corpus and the earliest use of the word
    "acabowl" we hold. The printed 1972 book itself has not been seen.
  gaps: Confirm against the printed 1972 handbook (Woodson, UA 0079).

- key: riceinfo-news-2000-lundin
  title: "Robert Lundin, 'Construction Zone Ahead—TFW Style!', the official story of the construction of New Wiess (riceinfo news page, posted 18–19 May 2000)"
  type: website
  date: 2000-05-19
  url: https://web.archive.org/web/20001119204500/http://riceinfo.rice.edu:80/projects/colleges/wiess/news/index.html
  local: riceinfo.rice.edu-wiess/text/news__index.html__20001119204500.md
  evidence: P
  notes: >
    By the Wiess "president emeritus": groundbreaking 5 Oct 1999; construction fence 16 Nov 1999; Phase 1 and 2
    utility tunnels; the new Wiess commons to be "borrowed" by Hanszen in 2000–01; completion scheduled
    December 2001, move-in planned January 2002; students had lobbied "over the past five years" for
    single-loaded corridors, external balconies and a large courtyard. Contacts: Lundin, John Hutchinson, Josh Katz.

