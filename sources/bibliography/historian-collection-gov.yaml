- key: constitution-hate-speech
  title: Complete Guiding Documents of Wiess College (undated; Google Docs export of c. early 2025)
  type: governing-document
  format: pdf
  date: c. 2025 (estimated)
  local: historian-collection/governance/undated-wiess-constitution-hate-speech.pdf
  evidence: P
  notes: >
    From the TFWKB collection (tfwdb folder); no public copy known. Original filename
    "Wiess ConstitutionND.pdf"; 20 pp; sixteen articles including Article XV Stance on Hate Speech;
    no "Last Amended" line. Dated by its PDF producer string, "Skia/PDF m134 Google Docs Renderer"
    (the 2026 PDF says m147, the 2017 Google exports m58), which places the export around
    January–March 2025. Word for word the 23 February 2026 text without its Executive Cabinet section
    (Art. IV §14), its Election Representatives section (Art. XI §14) and the Last Amended line. Not the
    2021–22 hate-speech amendment as ratified, though it carries that clause's descendant.
    Governance repo tag v2025-spring (commit date 2025-02-15, an estimate).

- key: housing-rules-2008
