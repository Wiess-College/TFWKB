# Sources added by the governance-changes writer (2026-10-04): roster pages, minutes pages and
# site captures used by docs/governance/* and docs/changes/*. Same fields as the other files.
# Single page captures are otherwise cited inline as [@wb <timestamp> <url>].

- key: riceinfo-rules-index-1997
  title: "'The Rules of Wiess College' index page, riceinfo site (Cunningham, 11 Aug 1997; capture 31 Jan 1998)"
  type: website
  date: 1997-08-11
  url: https://web.archive.org/web/19980131012150/http://riceinfo.rice.edu/projects/colleges/wiess/rules/index.html
  local: riceinfo.rice.edu-wiess/text/rules__index.html__19980131012150.md
  evidence: P
  notes: >
    Links the 1993 Constitution, the 1991 Rules and the 1993 Bylaws under the webmaster's note
    "These rules are extremely out of date. I'm working on getting a recent copy." — the only
    contemporary statement that newer texts existed in 1997.

- key: riceinfo-cabinet-1998
  title: "'Cabinet' roster and office descriptions, riceinfo site (Joe Abraham, 19 Jul 1998; capture 19 Feb 1999)"
  type: website
  date: 1998-07-19
  url: https://web.archive.org/web/19990219085339/http://riceinfo.rice.edu/projects/colleges/wiess/people/cabinet.html
  local: riceinfo.rice.edu-wiess/text/people__cabinet.html__19990219085339.md
  evidence: P
  notes: >
    "Consisting of twelve elected and three appointed offices, it sets college policy and determines
    how funds will be spent." Names the 1998–99 officers, a Game Room Chairman, an $18,000 annual
    budget, and meetings "alternating Wednesdays in the outer commons".

- key: riceinfo-court-1998
  title: "'The College Court' roster, riceinfo site (Joe Abraham, 19 Jul 1998; capture 19 Feb 1999)"
  type: website
  date: 1998-07-19
  url: https://web.archive.org/web/19990219095220/http://riceinfo.rice.edu/projects/colleges/wiess/people/court.html
  local: riceinfo.rice.edu-wiess/text/people__court.html__19990219095220.md
  evidence: P
  notes: >
    Chief Justice and four Associate Justices listed; "two Assistant Justices elected sometime in the
