- key: riceinfo-minutes-1999
  title: "'Cabinet Minutes' placeholder page, riceinfo site (Cunningham, 11 Aug 1997; captures 1999)"
  type: website
  date: 1997-08-11
  url: https://web.archive.org/web/19990507193831/http://riceinfo.rice.edu/projects/colleges/wiess/news/minutes/index.html
