# O-Week books and handbooks—the student-written record.
# Every entry: key, title, type, date, url (permalink), local (path in the historian's corpus,
# ~/projects/wiess-archive/), evidence (P/R/T), notes, gaps. Pages cite as [@key p.N].
# Wayback URLs without "id_" open the archived PDF in the browser; "#page=N" is added by the hook when a page is cited.

- key: handbook-1994
  title: Wiess College Freshman Handbook 1994 (as transcribed on the 1997–2000 riceinfo site)
  type: oweek-book
  date: 1994
  url: https://web.archive.org/web/20001207053100/http://riceinfo.rice.edu:80/projects/colleges/wiess/college/gloss.html
  local: riceinfo.rice.edu-wiess/text/college__gloss.html__20001207053100.md
  evidence: P
  notes: >
    The glossary ("From the 1994 Freshman Handbook (and undoubtedly those of many years preceding)"),
    the history page and the Masters page of the first Wiess website are transcriptions of the 1994
    Freshman Handbook; the rooms page is from the 1995 book. Oldest O-Week-book text we hold.
  gaps: The printed 1994 book itself is being pulled; confirm what was copied verbatim and what was edited.

