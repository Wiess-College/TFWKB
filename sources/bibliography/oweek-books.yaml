    intro: https://web.archive.org/web/20040619001755/http://www.teamwiess.com/oweek/01-14%20intro.pdf
    wiess: https://web.archive.org/web/20040416083807/http://www.teamwiess.com/oweek/35-44%20wiess.pdf
    college: https://web.archive.org/web/20040416075437/http://www.teamwiess.com/oweek/61-74%20college.pdf
    conclusions: https://web.archive.org/web/20040416103931/http://www.teamwiess.com/oweek/80-88%20conclusions.pdf
  evidence: P
  notes: >
    Sections 01–14 (intro), 35–44 (Wiess), 61–74 (college), 80–88 (conclusions, with the glossary).
    Cite the section: the url above is the conclusions section; the others are
    web.archive.org/web/20040619001755/http://www.teamwiess.com/oweek/01-14%20intro.pdf,
    .../20040416083807/http://www.teamwiess.com/oweek/35-44%20wiess.pdf,
    .../20040416075437/http://www.teamwiess.com/oweek/61-74%20college.pdf.
  gaps: Pages 15–34, 45–60 and 75–79 were never posted.

