# Every photograph shown on a Record page, with its caption, credit and date.
#
# This is the one place to change a photo's caption or move it to another page. After any change, run
#
#     python3 tools/apply_photos.py
#
# which copies it onto the Record pages, the Photographs page and docs/assets/photos/manifest.tsv.
# Editing those by hand does not last: the next run overwrites them from here.
#
# Each photo is one block starting with "- photo:". Copy a block to add a photo. Its fields:
#
#     photo      the file, relative to docs/assets/photos/ (make_web_photos.py makes it and its manifest row)
#     gallery    which gallery it goes in: one of the names under "galleries:" below
#     caption    what the photo shows, in plain text (no links); it is also the lightbox title
#     credit     who made or published it, in plain text
#     citation   the citation shown after the credit, such as "[@rhc 2012-12-04 ...]", or "" for none
#     date       as precise as the evidence allows: "1949-03-01", "1969-09", "c.1983"
#     topic      a short subject for the manifest, such as "Old Wiess, 2002"
#
# Writing the text:
#
#   - The caption goes on the lines after "caption: >-", indented to line up. Write it as ordinary text
#     with no quotation marks around it, and wrap it over as many lines as you like: the lines are joined
#     with spaces. A blank line inside a caption is an error.
#   - Every other value goes in double quotation marks, as below. A double quotation mark inside the text
#     is written \" (a straight one; curly quotes need nothing special).
#   - Indent with spaces, never tabs, and keep each field lined up with the ones around it.
#   - A line starting with # is a note for editors, like this one, and is ignored.
#
# Text used by many photos is kept once, under "reusable:", and a photo uses it by writing its name after a
# "*", such as  credit: *credit-source-not-recorded  . Correcting the text there corrects every photo that
# uses it. Typing the text out in full works just as well.

reusable:
  credit-woodson-via-rice-history-corner: &credit-woodson-via-rice-history-corner "Rice University, Woodson Research Center, via Rice History Corner"
  credit-colin-delany-2002: &credit-colin-delany-2002 "Colin Delany '91, 'wiess college | abandoned', August 2002"
  credit-source-not-recorded: &credit-source-not-recorded "TFWKB photo collection; source not recorded"
  citation-wiess-hall-construction-post: &citation-wiess-hall-construction-post "[@rhc 2012-12-04 wiess-hall-construction-1949]"

