# Copy to tfwkb.config.yml (or run ./setup.sh, which writes it for you). tfwkb.config.yml is not committed:
# each machine has its own paths. Only the tools in tools/ read it; the site builds without it.
#
# A relative path is relative to this repository's root folder. "~" means your home folder.
# TFWKB_GOVERNANCE_REPO in the environment overrides it (see tools/paths.py).

# A checkout of github.com/Wiess-College/governance. Used by tools/import_governance_changes.py.
# Leave it out, or empty, if you don't have one.
governance_repo: ../governance
