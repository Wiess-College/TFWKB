site_name: Team FamilyKB
site_description: The sourced history of Wiess College, Rice University — traditions, places, people, governance and how they changed, with every claim cited to a permalink.
site_url: https://wiess-college.github.io/TFWKB/
repo_url: https://github.com/Wiess-College/TFWKB
repo_name: Wiess-College/TFWKB
edit_uri: edit/main/docs/
copyright: Text © Wiess College contributors, CC BY-SA 4.0 · tools MIT

theme:
  name: material
  language: en
  logo: assets/wiessshield.svg
  favicon: assets/wiessshield.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Source Serif 4
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.tooltips
    - toc.follow

extra_css:
  - assets/familykb.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs, sources]
      check_paths: true
  - pymdownx.tasklist

plugins:
  - search

hooks:
  - hooks/citations.py

extra:
  status:
    draft: Draft — assembled from sources, not yet reviewed by a maintainer
    reviewed: Reviewed against its sources by a maintainer
    generated: Generated from data by a tool; edit the data, not the page
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Wiess-College
      name: Wiess College on GitHub

