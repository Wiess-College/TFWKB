site_name: Team Family Knowledgebase
site_description: The sourced history of Wiess College at Rice University; the traditions, places, people, governance and how they changed.
site_url: https://wiess-college.github.io/TFWKB/
repo_url: https://github.com/Wiess-College/TFWKB
repo_name: Wiess-College/TFWKB
edit_uri: edit/main/docs/
copyright: Text © Wiess College contributors, CC BY-SA 4.0 · tools MIT

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/wiessshield.svg
  favicon: assets/wiessshield.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Lato
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.tooltips
    - toc.follow

extra_css:
  - assets/familykb.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs, sources]
      check_paths: true
  - pymdownx.tasklist
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      width: auto
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom

hooks:
  - hooks/citations.py

extra:
  # where the per-page "Discuss" button goes (GitHub Discussions must be enabled;
  # or point it at the wiki: https://github.com/Wiess-College/TFWKB/wiki)
  discuss_url: https://github.com/Wiess-College/TFWKB/discussions
  status:
    draft: assembled from sources but not yet reviewed by a maintainer
    reviewed: sources checked by a maintainer
    generated: data from a tool
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Wiess-College
      name: Wiess College on GitHub

