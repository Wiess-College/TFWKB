name: Mirror the Commons (wiki) into sources/commons-snapshots

on:
  schedule:
    - cron: "23 7 * * *"   # nightly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone the wiki
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.wiki.git wiki || { echo "no wiki yet"; exit 0; }
          mkdir -p sources/commons-snapshots
          rsync -a --delete --exclude .git wiki/ sources/commons-snapshots/
      - name: Commit if changed
        run: |
          git config user.name "familypedia-bot"
          git config user.email "familypedia-bot@users.noreply.github.com"
          git add sources/commons-snapshots
          git diff --cached --quiet || git commit -m "Commons snapshot $(date -u +%F)" && git push
