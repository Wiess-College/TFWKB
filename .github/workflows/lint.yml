name: Lint Python tools

on:
  push:
    branches: [main]
    paths: ["tools/**", "setup.sh", ".github/workflows/lint.yml"]
  pull_request:
    paths: ["tools/**", "setup.sh", ".github/workflows/lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: No machine-specific paths (use tools/repository_folders.py instead)
        run: |
          if grep -rnE '/home/|/Users/|/mnt/' --include='*.py' --include='*.sh' tools setup.sh; then
            echo '::error::A path from one machine is written into the code above. Find the folder with tools/repository_folders.py.'
            exit 1
          fi
      - run: pip install -r requirements.txt
      - name: ruff (docstrings, naming case, line length, with-blocks, type hints)
        working-directory: tools
        run: ruff check --output-format=github
      - name: pylint (name length and banned abbreviations)
        working-directory: tools
        run: pylint

