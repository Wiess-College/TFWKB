name: Lint Python tools

on:
  push:
    branches: [main]
    paths: ["tools/**", "hooks/**", "pyproject.toml", "requirements-dev.txt", ".github/workflows/lint.yml"]
  pull_request:
    paths: ["tools/**", "hooks/**", "pyproject.toml", "requirements-dev.txt", ".github/workflows/lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: ruff (docstrings, naming case, line length, with-blocks, type hints)
        run: ruff check --output-format=github
      - name: pylint (name length and banned abbreviations)
        run: pylint tools hooks
